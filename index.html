<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ForgeFit">
<meta name="theme-color" content="#090d16">
<title>ForgeFit — Smart Recovery &amp; Overload Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#090d16;--card:#111827;--card2:#0c1220;--line:#1f2937;--tx:#f1f5f9;--mut:#94a3b8;--dim:#64748b;--or:#f97316;--or2:#fb923c;--gr:#10b981;--am:#f59e0b;--rd:#f43f5e;--vi:#8b5cf6;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);--b2:#273043;--b3:#334155;--btn:#1a2234;--inset:#050810;--chip:#0f1626;--snum:#111a2b;--panel:#0f1522;--press:#151e33;--grid:#1b2538;--hcell:#162033;--toast:#1e293b;--toast-tx:#f1f5f9;--bar:rgba(9,13,22,.98);--bd:rgba(255,255,255,.07);--tx2:#e2e8f0;--tx3:#cbd5e1;--vi-t:#c4b5fd;--rd-t:#fb7185;--rd-t2:#fda4af;--gr-t:#34d399;--am-t:#fbbf24;--or-t:#fdba74;--shadow:rgba(0,0,0,.6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(84px + var(--sab));overscroll-behavior-y:contain}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--inset);border:1px solid var(--line);border-radius:12px;padding:10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--or);outline-offset:2px}
textarea{resize:vertical}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--or-t)}
input[type=search]{-webkit-appearance:none}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--or)}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
h1,h2,h3,p{margin:0}
h1{font-size:26px;line-height:1.15;margin-bottom:6px}
.h2{font-size:17px;font-weight:800}
.exn{font-size:17px;font-weight:800;margin-top:4px}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:11.5px}.center{text-align:center}.right{text-align:right}
.or{color:var(--or2)}.gr{color:var(--gr)}.am{color:var(--am)}.rd{color:var(--rd)}
.big{font-size:22px;font-weight:900}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.top{align-items:flex-start}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.gap6{gap:6px}
.col{display:flex;flex-direction:column;gap:12px}.gap6.col{gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pt8{padding-top:8px}.mt8{margin-top:8px}.px4{padding:0 4px}.full{width:100%}
.sep{height:1px;background:var(--line)}
.link{color:var(--or2);font-size:13px;text-decoration:underline}

/* header */
#hdr{position:sticky;top:0;z-index:30;background:var(--bar);border-bottom:1px solid var(--line);padding-top:var(--sat)}
.hbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;max-width:640px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#f97316,#d97706);display:grid;place-items:center;color:#0b0f19;box-shadow:0 4px 14px rgba(249,115,22,.3)}
.logo svg{width:23px;height:23px}
.brand h1{font-size:15px;font-weight:900;letter-spacing:.12em;margin:0}.brand h1 span{color:var(--or)}
.brand p{font-size:10px;color:var(--mut);font-weight:600}
.pill{font-size:12px;font-weight:700;padding:7px 10px;border-radius:10px;background:rgba(249,115,22,.12);border:1px solid rgba(249,115,22,.35);color:var(--or2)}
#clock{font-size:12px;font-weight:700;color:var(--mut)}
#tbar{position:relative;overflow:hidden;background:#7c2d12;border-top:1px solid #9a3412}
#tfill{position:absolute;inset:0;background:var(--or);transform-origin:left;transition:transform 1s linear}
.tin{position:relative;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;max-width:640px;margin:0 auto;color:#0b0f19}
.tin small{display:block;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
#tdisp{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.tin .row button{background:rgba(9,13,22,.22);font-weight:800;font-size:13px;padding:7px 10px;border-radius:9px}
.tin .row .skip{background:#090d16;color:var(--or2)}

main{max-width:640px;margin:0 auto;padding:14px}
.tab{display:flex;flex-direction:column;gap:14px}
.tab[hidden]{display:none!important}

/* cards & controls */
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px}
.card.col{gap:12px}
details.card summary{cursor:pointer;list-style:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border-radius:13px;font-weight:800;font-size:14px;border:1px solid transparent;text-align:center}
.btn.big{padding:15px;font-size:15px}
.btn.pri{background:var(--or);color:#0b0f19;box-shadow:0 6px 18px rgba(249,115,22,.22)}
.btn.sec{background:var(--btn);border-color:var(--b2);color:var(--tx2)}
.btn.ok{background:var(--gr);color:#04130d}
.btn.vio{background:rgba(139,92,246,.16);border-color:rgba(139,92,246,.4);color:var(--vi-t)}
.btn.danger{background:rgba(244,63,94,.12);border-color:rgba(244,63,94,.4);color:var(--rd-t2)}
.mini{font-size:12.5px;font-weight:700;padding:7px 10px;border-radius:10px;background:var(--btn);border:1px solid var(--b2);color:var(--tx3)}
.mini.pri{background:var(--or);color:#0b0f19;border-color:var(--or)}
.ib{width:36px;height:36px;border-radius:11px;background:var(--btn);border:1px solid var(--b2);font-size:17px;font-weight:800;display:grid;place-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.scrollx{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:8px -14px 0;padding:0 14px}
.scrollx::-webkit-scrollbar{display:none}
#sheet .scrollx{margin:0 -16px;padding:0 16px}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:999px;font-size:13px;font-weight:700;background:var(--chip);border:1px solid var(--line);color:var(--mut)}
.chip.on{background:rgba(249,115,22,.18);border-color:var(--or);color:var(--or2)}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;border:1px solid var(--line);color:var(--mut)}
.tag.gr{color:var(--gr-t);background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.35)}
.tag.am{color:var(--am-t);background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.35)}
.tag.rd{color:var(--rd-t);background:rgba(244,63,94,.1);border-color:rgba(244,63,94,.35)}
.tag.vi{color:var(--vi-t);background:rgba(139,92,246,.18);border-color:rgba(139,92,246,.4)}
.tag.or{color:var(--or2);background:rgba(249,115,22,.14);border-color:rgba(249,115,22,.35)}
.field label{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.sel-sm{width:auto;padding:7px 10px;font-size:14px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}.check input{width:auto}
.empty{padding:18px;text-align:center;color:var(--dim);font-size:14px;border:1px dashed var(--line);border-radius:14px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;border:1px solid}
.banner ul{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--mut)}
.banner.warn{background:rgba(244,63,94,.1);border-color:rgba(244,63,94,.4)}
.banner.note{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.35)}
.banner.info{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.4)}
.banner.ok{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.3)}

/* exercise card + set rows */
.shead,.srow{display:grid;grid-template-columns:34px 1fr 1fr 82px 44px;gap:6px;align-items:center}
.shead{margin-top:10px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);text-align:center}
.sets{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.srow{padding:4px;border-radius:13px;background:var(--card2);border:1px solid transparent}
.srow.done{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.35)}
.srow input,.srow select{height:42px;padding:0 4px;text-align:center;font-weight:800;background:var(--inset);border-radius:10px}
.srow select{font-size:13px;color:var(--am);text-align-last:center;padding:0 2px}
.snum{height:38px;border-radius:10px;font-weight:900;font-size:13px;color:var(--mut);background:var(--snum)}
.snum.t-warmup{color:var(--am-t);background:rgba(245,158,11,.12)}
.snum.t-drop{color:var(--vi-t);background:rgba(139,92,246,.18)}
.chk{height:42px;border-radius:11px;background:var(--btn);border:1px solid var(--b2);font-weight:900;font-size:18px;color:#04130d}
.chk.on{background:var(--gr);border-color:var(--gr)}
.cue summary{font-size:12px;color:var(--dim);cursor:pointer;margin-top:10px}
.cue p{font-size:13px;color:var(--mut);padding-top:6px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:13px;background:var(--card2);border:1px solid var(--line)}
button.prow:active{background:var(--press)}
.prow.bad{border-color:rgba(244,63,94,.4)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 8px;text-align:center}
.tile b{display:block;font-size:20px;font-weight:900;color:var(--or2)}.tile span{font-size:11px;color:var(--mut)}
.tempo-view{text-align:center;padding:18px;border-radius:16px;background:var(--card2);border:1px solid var(--line)}
#tp-phase{font-size:26px;font-weight:900;color:var(--or2)}#tp-count{font-size:64px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}

/* plates */
.plates-vis{display:flex;align-items:center;gap:3px;min-height:80px;padding:8px 0}
.plates-vis i{font-style:normal;display:grid;place-items:center;width:20px;border-radius:5px;background:linear-gradient(#fb923c,#c2410c);font-size:9px;font-weight:900;color:#190a02}
.barend{width:26px;height:10px;border-radius:4px;background:#64748b;margin-right:2px}

/* recovery */
.rcell{display:flex;flex-direction:column;gap:7px;padding:12px;border-radius:14px;background:var(--card2);border:1px solid var(--line)}
.bar{height:10px;border-radius:999px;background:var(--inset);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;transition:width .3s}
.bg-gr{background:var(--gr)}.bg-am{background:var(--am)}.bg-rd{background:var(--rd)}
.rcell input[type=range]{width:150px}

/* charts + heatmap */
.chart{width:100%;height:auto;margin-top:8px}
.chart .grid line{stroke:var(--grid);stroke-width:1}.chart text{fill:var(--dim);font-size:9px}
.chart .ln{fill:none;stroke:var(--or);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:rgba(249,115,22,.12)}.chart circle{fill:var(--or2)}
.heat{display:flex;flex-direction:column;gap:4px;margin:8px 0 4px}
.hrow{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:center;font-size:12px;color:var(--mut)}
.hcells{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.hcells i{aspect-ratio:1;border-radius:4px;background:var(--card2);border:1px solid var(--hcell)}
.wrow{display:grid;grid-template-columns:78px 1fr 34px;gap:8px;align-items:center;font-size:12px;color:var(--mut);margin-top:7px}
.wrow em{font-style:normal;text-align:right;color:var(--tx);font-weight:800}
.wbar{position:relative;height:10px;background:var(--inset);border-radius:999px;overflow:hidden}
.wbar .zone{position:absolute;left:40%;width:40%;top:0;bottom:0;background:rgba(16,185,129,.18)}
.wbar i{position:absolute;left:0;top:0;bottom:0;background:var(--or);border-radius:999px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.photos figure{margin:0;position:relative}.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;display:block;background:var(--card2)}
.photos figcaption{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);padding-top:3px}
.photos .empty{grid-column:1/-1}

/* settings */
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.trow span{display:flex;flex-direction:column}.trow b{font-size:14px}.trow em{font-style:normal;font-size:12px;color:var(--mut);margin-top:2px}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;padding:0;border-radius:999px;background:var(--b2);border:0;position:relative;flex:0 0 auto;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw:checked{background:var(--or)}.sw:checked::after{transform:translateX(18px)}
.gear{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gear button{display:flex;justify-content:space-between;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--dim);font-weight:700;font-size:13px}
.gear button.on{background:rgba(249,115,22,.14);border-color:var(--or);color:var(--tx)}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bar);border-top:1px solid var(--line);padding-bottom:var(--sab)}
#nav div{display:grid;grid-template-columns:repeat(5,1fr);max-width:640px;margin:0 auto}
#nav button{padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--dim)}
#nav button{position:relative}
#nav button svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button.on svg{stroke-width:2.1}
#nav button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:2.5px;border-radius:0 0 4px 4px;background:var(--or)}
#nav button.on{color:var(--or)}

/* sheet / overlays */
#sheet{position:fixed;inset:0;z-index:60}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.65)}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:90vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .22s ease-out;padding-bottom:var(--sab)}
#sheet.open .panel{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--b3);margin:8px auto 0}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px}.sheet-h h3{font-size:17px;font-weight:800}
#sheet-b{padding:8px 16px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
#toast{position:fixed;left:50%;bottom:calc(92px + var(--sab));transform:translate(-50%,20px);background:var(--toast);color:var(--toast-tx);border:1px solid var(--b3);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#pr{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 30%,#7c2d12,#090d16 70%);display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}
#pr-body{position:relative;text-align:center;max-width:420px;width:100%;display:flex;flex-direction:column;gap:8px;align-items:center}
.trophy{font-size:80px;line-height:1}.prtag{font-size:12px;font-weight:900;letter-spacing:.18em;color:var(--or2)}
#pr h2{font-size:24px}.prbig{font-size:34px;font-weight:900}
#pr .row{width:100%}
#confetti span{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
#onboard{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;padding:calc(18px + var(--sat)) 18px calc(18px + var(--sab))}
.ob-in{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px}
.ob-body{flex:1;display:flex;flex-direction:column;gap:14px}
.dots{display:flex;gap:6px}.dots i{width:26px;height:5px;border-radius:5px;background:var(--line)}.dots i.on{background:var(--or)}
.opt{display:flex;flex-direction:column;gap:3px;text-align:left;padding:15px;border-radius:16px;background:var(--card);border:1.5px solid var(--line)}
.opt b{font-size:16px}.opt span{font-size:13px;color:var(--mut)}
.opt.on{border-color:var(--or);background:rgba(249,115,22,.12)}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--mut);z-index:200}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

:root{color-scheme:dark}
input[type=date]{min-height:42px}
/* drag handle */
.ex{position:relative}
.grip{flex:0 0 auto;width:30px;height:36px;margin:-2px 0 0 -6px;display:grid;place-items:center;touch-action:none;cursor:grab;color:var(--dim);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border-radius:10px}
.grip svg{width:20px;height:20px;fill:currentColor}
.grip:active{color:var(--or2)}
.ex.dragging{z-index:25;border-color:var(--or);box-shadow:0 16px 38px var(--shadow);transition:none;will-change:transform}
body.dragging-body{-webkit-user-select:none;user-select:none;cursor:grabbing}
/* segmented control + quick log */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:3px;gap:3px}
.seg button{padding:9px 6px;border-radius:10px;font-weight:800;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--or);color:#0b0f19}
.prow .grow{min-width:0}
#exlist.reordering .ex > :not(.top){display:none!important}
#exlist.reordering .ex{padding-bottom:10px}

/* ===== v4 additions ===== */
/* bigger tap targets while logging */
.shead,.srow{grid-template-columns:38px 1fr 1fr 80px 52px;gap:6px}
.sets{gap:8px}
.srow{padding:5px;position:relative;touch-action:pan-y;transition:transform .15s ease}
.srow input,.srow select{height:48px;font-size:17px}
.srow select{font-size:13px}
.snum{height:44px}
.chk{height:48px;border-radius:12px;font-size:20px}
/* swipe a set: left deletes, right duplicates */
.swrap{position:relative;border-radius:14px}
.swbg{position:absolute;inset:0;display:none;align-items:center;justify-content:space-between;padding:0 18px;border-radius:14px;font-size:13px;font-weight:800;color:#fff}
.swrap.sw-del .swbg,.swrap.sw-dup .swbg{display:flex}
.swrap.sw-del .swbg{background:rgba(244,63,94,.9)}
.swrap.sw-dup .swbg{background:rgba(139,92,246,.9)}
.swrap.sw-del .swbg span:first-child,.swrap.sw-dup .swbg span:last-child{visibility:hidden}
.swrap.sw-go .swbg{filter:brightness(1.18)}
.srow.swiping{transition:none;z-index:2;background:var(--card);box-shadow:0 4px 14px var(--shadow)}
/* coaching chip on exercise cards */
.coach{display:flex;gap:8px;align-items:center;width:100%;text-align:left;margin-top:10px;padding:9px 12px;border-radius:12px;font-size:13px;font-weight:700;border:1px solid;line-height:1.3}
.coach b{font-size:17px}
.coach.up{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.4);color:var(--gr-t)}
.coach.dn{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.35);color:var(--am-t)}
/* week strip */
button.card.week{display:block;width:100%;text-align:left;color:inherit}
.wk7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.wd{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:var(--dim);min-width:0}
.wd span{font-size:10px;font-weight:800}
.wd b{font-size:15px;font-weight:800;color:var(--tx2)}
.wd small{font-size:9.5px;font-weight:700;white-space:nowrap}
.wd.did{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.4);color:var(--gr-t)}
.wd.did b{color:var(--gr-t)}
.wd.plan small{color:var(--or2)}
.wd.today{border-color:var(--or);box-shadow:0 0 0 1px var(--or) inset}
.wd.miss{opacity:.55}
.wadv{margin-top:9px;font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.wadv i{font-style:normal;color:var(--or2);flex:0 0 auto}
.wadv.go{color:var(--gr-t)}.wadv.light{color:var(--am-t)}.wadv.rest{color:var(--rd-t)}.wadv.ok{color:var(--vi-t)}
/* training block dots */
.bdots{display:flex;gap:5px}
.bdots i{flex:1;height:8px;border-radius:5px;background:var(--line)}
.bdots i.past{background:var(--gr)}.bdots i.cur{background:var(--or)}.bdots i.dl{outline:1.5px dashed var(--vi);outline-offset:1px}
/* toast with an action */
#toast.act{display:flex;gap:14px;align-items:center}
#toast.act.show{pointer-events:auto}
#toast button{color:#fb923c;font-weight:800;font-size:14px;padding:4px 6px}
/* progress */
.tiles.t4{grid-template-columns:repeat(4,1fr)}
.tiles.t4 .tile{padding:10px 4px}.tiles.t4 .tile b{font-size:17px}.tiles.t4 .tile span{font-size:10px;display:block;line-height:1.15}
.wsub{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--dim);padding-left:86px;margin-top:2px}
.chart .ln.a{stroke:var(--or)}.chart .ln.b{stroke:var(--vi)}.chart circle.a{fill:var(--or2)}.chart circle.b{fill:var(--vi)}
.chart .grid line.zero{stroke:var(--dim);stroke-dasharray:3 3}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}.legend i.a{background:var(--or)}.legend i.b{background:var(--vi)}
/* misc */
.newlist{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--mut)}.newlist li{margin:4px 0}
ol.how{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ol.how li{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:13px;background:var(--card2);border:1px solid var(--line)}
ol.how b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--or2)}
ol.how span{font-size:14px;line-height:1.4}
a.btn{text-decoration:none}
#pname{max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== light theme (dark stays the default) ===== */
:root[data-theme=light]{color-scheme:light;--bg:#f2f4f9;--card:#ffffff;--card2:#eef1f7;--line:#dde3ee;--tx:#0f172a;--mut:#4b5a72;--dim:#6b7a90;--or2:#c2410c;--gr:#059669;--rd:#e11d48;--vi:#7c3aed;
--b2:#cfd7e5;--b3:#b8c2d4;--btn:#e8ecf4;--inset:#ffffff;--chip:#eef1f7;--snum:#e3e8f1;--panel:#ffffff;--press:#e1e6f0;--grid:#e3e8f1;--hcell:#dfe5ef;--bar:rgba(255,255,255,.96);--bd:rgba(15,23,42,.09);--tx2:#1e293b;--tx3:#334155;--vi-t:#6d28d9;--rd-t:#be123c;--rd-t2:#be123c;--gr-t:#047857;--am-t:#92400e;--or-t:#9a3412;--shadow:rgba(15,23,42,.22)}
:root[data-theme=light] .gr{color:#047857}
:root[data-theme=light] .rd{color:#be123c}
:root[data-theme=light] .am,:root[data-theme=light] .srow select{color:#b45309}
:root[data-theme=light] .sw::after{box-shadow:0 1px 3px rgba(0,0,0,.35)}
:root[data-theme=light] .card,:root[data-theme=light] .tile{box-shadow:0 1px 2px rgba(15,23,42,.05)}
:root[data-theme=light] #pr{--tx:#f1f5f9;--mut:#94a3b8;--btn:#1a2234;--b2:#273043;--tx2:#e2e8f0;--or2:#fb923c;--bg:#090d16}

/* v8 */
.exnote{display:block;width:100%;text-align:left;margin-top:6px;padding:7px 10px;border-radius:10px;font-size:13px;color:var(--tx2);background:var(--inset);border:1px dashed var(--b3)}
.emptyico{font-size:38px;line-height:1}
.cmp2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cmp2 figure{margin:0}
.cmp2 img,.phmiss{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;display:block;background:var(--card2)}
.phmiss{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mut)}
.cmp2 figcaption{font-size:12px;color:var(--mut);padding-top:4px;text-align:center}
.tile em{font-style:normal;font-weight:800}
@media (prefers-reduced-motion:no-preference){.srow.pop{animation:ffrow .6s ease-out}.srow.pop .chk{animation:ffpop .4s cubic-bezier(.2,1.7,.4,1)}.trophy{animation:fftro 1s cubic-bezier(.2,1.5,.4,1)}}
@keyframes ffrow{0%{box-shadow:0 0 0 0 rgba(16,185,129,.55)}100%{box-shadow:0 0 0 14px rgba(16,185,129,0)}}
@keyframes ffpop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes fftro{0%{transform:scale(.3) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0)}}

/* ---------- v10: plan / live session, achievements, grouped settings ---------- */
.card.plan{padding:12px}
.card.plan .planmain{all:unset;box-sizing:border-box;display:block;cursor:pointer;min-width:0;padding:2px 0}
.card.plan .planmain:focus-visible{outline:2px solid var(--or);outline-offset:3px;border-radius:8px}
.card.plan .exn{margin:4px 0 2px}
.card.sess{border-color:rgba(249,115,22,.45);background:linear-gradient(180deg,rgba(249,115,22,.08),transparent 70%),var(--card)}
.card.sess.paused{border-color:rgba(245,158,11,.55);background:linear-gradient(180deg,rgba(245,158,11,.12),transparent 70%),var(--card)}
.sess-time{display:block;font-size:30px;font-weight:900;letter-spacing:.5px;font-variant-numeric:tabular-nums;color:var(--or2)}
.card.sess.paused .sess-time{color:var(--am-t,#f59e0b);opacity:.85}
.lbl.live{color:#34d399}
#exlist.dimmed{opacity:.6}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 .btn{padding:12px 6px}
.subh{margin:14px 2px 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.ach{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-top:8px}
.ach .aic{font-size:24px;line-height:1}
.ach b{font-size:14px}
.grpt{margin:18px 4px 2px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:800}
.card.grp{padding:0;overflow:hidden}
.grph{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;cursor:pointer}
.grph:focus-visible{outline:2px solid var(--or);outline-offset:-2px}
.grph .gic{font-size:22px;width:30px;text-align:center}
.grph b{display:block;font-size:15px}
.grph em{display:block;font-style:normal;font-size:12px;color:var(--mut);margin-top:1px}
.grph .chev{color:var(--mut);font-size:16px}
.grpb{padding:2px 16px 16px;border-top:1px solid var(--bd);padding-top:14px}
@media (prefers-reduced-motion:no-preference){.card.sess.paused .sess-time{animation:ffblink 1.6s ease-in-out infinite}@keyframes ffblink{50%{opacity:.45}}}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   ForgeFit core: data, state, persistence, audio/haptics, timers
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KG = 0.45359237;
/* ---------- live session (started / paused) ---------- */
const SESSK = ['startedAt', 'pausedAt', 'pausedMs', 'pausedRest', 'pausedLabel'];
const carrySession = (from, to) => { SESSK.forEach(k => { if (from && from[k]) to[k] = from[k]; }); return to; };
const sessActive = () => !!state.workout.startedAt;
const sessPaused = () => !!(state.workout.startedAt && state.workout.pausedAt);
const sessMs = (now = Date.now()) => { const w = state.workout; return w.startedAt ? Math.max(0, (w.pausedAt || now) - w.startedAt - (w.pausedMs || 0)) : 0; };
const clearSession = w => { SESSK.forEach(k => { delete w[k]; }); w.startedAt = null; w.pausedAt = null; w.pausedMs = 0; return w; };
const DAY = 864e5;
const fmtDate = (t, o) => new Date(t).toLocaleDateString('en-US', o || { month: 'short', day: 'numeric' });
const fmtDT = t => fmtDate(t) + ' ' + new Date(t).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
const sod = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const ymd = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const APP_VER = '10';   // filled in by build.py from sw.js so the two can never disagree
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- exercise database ---------- */
const MUSCLES = ['Chest', 'Back', 'Shoulders', 'Quads', 'Hamstrings', 'Glutes', 'Calves', 'Biceps', 'Triceps', 'Core'];
const SPLIT_OF = {
  Chest: 'push upper full', Shoulders: 'push upper full', Triceps: 'push upper full',
  Back: 'pull upper full', Biceps: 'pull upper full',
  Quads: 'legs lower full', Hamstrings: 'legs lower full', Glutes: 'legs lower full', Calves: 'legs lower full',
  Core: 'push pull legs upper lower full'
};
const TEMPO_DEF = { compound: '2-0-1-0', isolation: '2-1-1-1', bodyweight: '2-0-1-0' };
const X = (id, name, primary, secondary, split, gear, orm, reps, sets, type, cue, o = {}) => ({

  default1RM: orm, reps, sets, type, cue, tempo: TEMPO_DEF[type] || '2-0-1-0', ...o

const BASE_EX = [
  // Chest
  X('bb_bench', 'Barbell Bench Press', 'Chest', ['Triceps', 'Shoulders'], 'push upper full', 'Barbell Bench', 235, 8, 4, 'compound', 'Pin shoulder blades back, touch lower chest, drive through your feet.', { alias: 'flat bench' }),
  X('incline_bb_bench', 'Incline Barbell Bench', 'Chest', ['Shoulders', 'Triceps'], 'push upper full', 'Barbell Bench', 195, 8, 3, 'compound', 'Bench at ~30°, bar to upper chest, elbows about 45° from torso.'),
  X('db_press', 'Dumbbell Flat Press (Total)', 'Chest', ['Triceps'], 'push upper full', 'Dumbbells Bench', 170, 10, 3, 'compound', 'Deep controlled stretch, press up and slightly in. Weight = both dumbbells combined.'),
  X('incline_db_press', 'Incline Dumbbell Press (Total)', 'Chest', ['Shoulders', 'Triceps'], 'push upper full', 'Dumbbells Bench', 150, 10, 3, 'compound', 'Bench ~30°, keep wrists stacked over elbows. Weight = both dumbbells.'),
  X('machine_chest_press', 'Machine Chest Press', 'Chest', ['Triceps', 'Shoulders'], 'push upper full', 'Machines', 200, 10, 3, 'compound', 'Handles level with mid-chest, shoulders down and back.'),
  X('cable_fly', 'Cable Chest Fly', 'Chest', [], 'push upper', 'Cables', 90, 12, 3, 'isolation', 'Soft elbows, hug a big tree, squeeze in the middle.'),
  X('pushups', 'Weighted / Deficit Push-Ups', 'Chest', ['Triceps', 'Core'], 'push upper full', 'Bodyweight', 0, 15, 3, 'bodyweight', 'Rigid plank, chest to floor, elbows ~45°. Weight = added load.', { bw: .64, seedReps: [10, 20, 30] }),
  X('dips', 'Dips (Bars / Chairs)', 'Chest', ['Triceps', 'Shoulders'], 'push upper', 'Bodyweight', 0, 10, 3, 'bodyweight', 'Lean slightly forward, lower until shoulders dip below elbows.', { bw: 1, seedReps: [3, 8, 14] }),
  // Shoulders
  X('ohp', 'Barbell Overhead Press', 'Shoulders', ['Triceps', 'Core'], 'push upper full', 'Barbell', 145, 8, 4, 'compound', 'Squeeze glutes, ribs down, press in a straight line, head through at the top.', { alias: 'overhead press' }),
  X('db_shoulder_press', 'Dumbbell Shoulder Press (Total)', 'Shoulders', ['Triceps'], 'push upper full', 'Dumbbells', 110, 10, 3, 'compound', 'Forearms vertical, press without flaring the ribs. Weight = both dumbbells.'),
  X('db_lat_raise', 'Dumbbell Lateral Raises (Total)', 'Shoulders', [], 'push upper', 'Dumbbells', 60, 12, 3, 'isolation', 'Lead with elbows, stop at shoulder height, no swinging.', { alias: 'lateral raise' }),
  X('cable_lat_raise', 'Cable Lateral Raise', 'Shoulders', [], 'push upper', 'Cables', 40, 12, 3, 'isolation', 'Constant tension, slow negative.'),
  X('landmine_press', 'Single-Arm Barbell Jammer Press', 'Shoulders', ['Chest', 'Core'], 'push upper', 'Barbell', 115, 10, 3, 'compound', 'Press up and forward along the arc, ribs stacked.'),
  X('face_pull', 'Cable Face Pull', 'Shoulders', ['Back'], 'pull upper', 'Cables', 70, 15, 3, 'isolation', 'Rope to eye level, pull apart, externally rotate at the end.'),
  X('rear_delt_fly', 'Rear Delt Fly (Total)', 'Shoulders', ['Back'], 'pull upper', 'Dumbbells', 40, 15, 3, 'isolation', 'Hinge, soft elbows, sweep wide.'),
  // Back
  X('bb_row', 'Barbell Bent-Over Row', 'Back', ['Biceps', 'Hamstrings'], 'pull upper full', 'Barbell', 205, 8, 4, 'compound', 'Hinge to ~45°, pull to lower ribs, keep spine neutral.', { alias: 'row' }),
  X('pendlay_row', 'Pendlay Row', 'Back', ['Biceps'], 'pull upper', 'Barbell', 195, 8, 3, 'compound', 'Dead-stop each rep on the floor, torso parallel.'),
  X('pullups', 'Pull-Ups / Chin-Ups (Added Wt)', 'Back', ['Biceps', 'Core'], 'pull upper full', 'PullupBar', 0, 8, 3, 'bodyweight', 'Start from a dead hang, chest to bar, control the descent. Weight = added load.', { bw: 1, seedReps: [3, 8, 13], alias: 'pull up' }),
  X('db_row', 'One-Arm Bench Dumbbell Row', 'Back', ['Biceps'], 'pull upper full', 'Dumbbells Bench', 100, 10, 3, 'compound', 'Pull elbow to hip, avoid twisting. Weight = one dumbbell x2 (total).'),
  X('lat_pulldown', 'Lat Pulldown', 'Back', ['Biceps'], 'pull upper full', 'Cables', 160, 10, 3, 'compound', 'Chest up, pull elbows down to ribs.'),
  X('seated_cable_row', 'Seated Cable Row', 'Back', ['Biceps'], 'pull upper full', 'Cables', 160, 10, 3, 'compound', 'Tall chest, row to navel, pause and squeeze.'),
  X('deadlift', 'Conventional Deadlift', 'Back', ['Hamstrings', 'Glutes', 'Core'], 'pull lower full', 'Barbell', 315, 5, 3, 'compound', 'Bar over midfoot, brace hard, push the floor away.'),
  X('superman', 'Superman / Back Extension', 'Back', ['Glutes'], 'pull full', 'Bodyweight', 0, 15, 3, 'bodyweight', 'Lift chest and legs, pause one second at the top.', { bw: 0, noE1: true }),
  // Quads
  X('bb_squat', 'Barbell Back Squat', 'Quads', ['Hamstrings', 'Glutes', 'Core'], 'legs lower full', 'Barbell', 275, 6, 4, 'compound', 'Brace, knees track over toes, hit depth, drive up.'),
  X('front_squat', 'Barbell Front Squat', 'Quads', ['Core', 'Glutes'], 'legs lower', 'Barbell', 215, 8, 3, 'compound', 'Elbows high, torso upright.'),
  X('bulgarian_split', 'Bulgarian Split Squat', 'Quads', ['Glutes', 'Hamstrings'], 'legs lower', 'Bench Dumbbells', 110, 10, 3, 'compound', 'Torso slightly forward, front shin vertical. Weight = both dumbbells.'),
  X('goblet_squat', 'Goblet Squat', 'Quads', ['Glutes', 'Core'], 'legs lower full', 'Dumbbells', 70, 12, 3, 'compound', 'Elbows inside knees at the bottom, chest tall.'),
  X('leg_press', 'Leg Press', 'Quads', ['Glutes', 'Hamstrings'], 'legs lower', 'Machines', 450, 10, 3, 'compound', 'Feet mid-platform, lower until hips start to tuck, never lock out hard.'),
  X('leg_extension', 'Leg Extension', 'Quads', [], 'legs lower', 'Machines', 150, 12, 3, 'isolation', 'Squeeze the quads at the top, slow lower.'),
  X('walking_lunge', 'Dumbbell Walking Lunge (Total)', 'Quads', ['Glutes', 'Hamstrings'], 'legs lower full', 'Dumbbells', 120, 10, 3, 'compound', 'Long stride, torso upright. Weight = both dumbbells.'),
  X('bw_squat', 'Bodyweight Squat', 'Quads', ['Glutes'], 'legs lower full', 'Bodyweight', 0, 20, 3, 'bodyweight', 'Sit between your hips, keep heels down.', { bw: 0, noE1: true }),
  // Hamstrings / Glutes / Calves
  X('rdl', 'Barbell Romanian Deadlift', 'Hamstrings', ['Back', 'Glutes', 'Core'], 'legs lower pull', 'Barbell', 265, 8, 4, 'compound', 'Hips back, soft knees, bar stays close, feel the hamstring stretch.'),
  X('db_rdl', 'Dumbbell Romanian Deadlift (Total)', 'Hamstrings', ['Glutes', 'Back'], 'legs lower pull', 'Dumbbells', 180, 10, 3, 'compound', 'Hinge, lats tight. Weight = both dumbbells.'),
  X('leg_curl', 'Leg Curl', 'Hamstrings', [], 'legs lower', 'Machines', 120, 12, 3, 'isolation', 'Hips pinned, curl heels to glutes, slow return.'),
  X('bb_hip_thrust', 'Barbell Bench Hip Thrust', 'Glutes', ['Hamstrings', 'Core'], 'legs lower full', 'Barbell Bench', 285, 10, 3, 'compound', 'Chin tucked, ribs down, full lockout, squeeze.'),
  X('glute_bridge', 'Glute Bridge', 'Glutes', ['Hamstrings'], 'legs lower full', 'Bodyweight', 0, 15, 3, 'bodyweight', 'Drive through heels, posterior pelvic tilt at the top.', { bw: 0, noE1: true }),

/* ---------- plate calculator ---------- */
function platePlan(total, bar, plates) {

}

/* ---------- smart deload / auto-regulation ---------- */
function deloadAdvice() {
  if (isDeload()) { const bd = !manualDeload(), until = bd ? (blockInfo() || {}).end : state.deload.until; return { level: 'active', reasons: ['Weights ~10% lighter, ~40% fewer sets, +1 reps in reserve' + (until ? ' until ' + fmtDate(until) : '') + (bd ? ' (final week of your training block)' : '')] }; }
  const reasons = [], H = state.history.filter(h => h.items && h.items.length);
  if (H.length < 3) return { level: 'none', reasons };
  const avg = avgRecovery(); if (avg < 50) reasons.push(`Average muscle freshness is only ${avg}%`);
  let hard = 0, tot = 0; H.slice(0, 3).forEach(h => h.items.forEach(i => i.sets.forEach(s => { if (s.type === 'warmup') return; tot++; if (s.fail || s.rir === 0) hard++; })));
  if (tot >= 12 && hard / tot > .35) reasons.push(`${Math.round(hard / tot * 100)}% of your last sets went to failure`);
  let reg = 0; Object.values(state.e1rmHist).forEach(a => { if (a.length >= 4) { const l = a.slice(-3).map(p => p.v), prev = a[a.length - 4].v; if (l[2] < prev * .98 && l[2] <= l[0]) reg++; } });
  if (reg >= 2) reasons.push(`${reg} lifts have trended down over their last sessions`);
  const weeks = new Set(H.filter(h => h.t > (state.lastDeload || 0) && h.t > Date.now() - 56 * DAY).map(h => Math.floor(h.t / (7 * DAY))));
  if (weeks.size >= 6) reasons.push(`${weeks.size} training weeks since your last deload`);
  return { level: reasons.length >= 2 ? 'deload' : reasons.length === 1 ? 'watch' : 'none', reasons };
}

  const l = lastPerf(ex.id, true); if (!l) return null;
  const ws = l.filter(s => s.type === 'work'); if (ws.length < 2) return null;
  const tgt = targetReps(ex);

  const top = Math.max(...ws.map(s => s.w)), to = top + inc();

  return { to, msg: `Hit ${tgt}+ reps on every set last time. Try ${to} ${unit()}` };
}

/* ---------- rest-day advice from recovery ---------- */
function bestSplitNow() {

    }));

}

  bb_bench: ['Lie back with your eyes under the bar, feet planted, shoulder blades pinched down and back.', 'Unrack, lower the bar to your lower chest with forearms vertical, then press up and slightly back over your shoulders.', 'Keep your butt on the bench. Use safety arms or a spotter near failure.'],
  incline_bb_bench: ['Set the bench to about 30 degrees and lie back with your shoulder blades pinched.', 'Lower the bar to your upper chest, elbows about 45 degrees from your torso, then press straight up.', 'A steeper bench shifts work to the shoulders, so stay near 30 degrees.'],
  db_press: ['Sit with the dumbbells on your thighs, lie back and kick them up to chest height.', 'Lower with control until you feel a stretch across the chest, then press up and slightly in.', 'The app logs both dumbbells combined (2 × 50 lb = 100).'],
  incline_db_press: ['Set the bench to about 30 degrees and start with the dumbbells at your upper chest.', 'Press up and slightly in, lower slowly to a deep stretch.', 'The app logs both dumbbells combined.'],
  machine_chest_press: ['Adjust the seat so the handles line up with mid-chest.', 'Press forward until your arms are almost straight, pause, and return slowly.', 'Keep your shoulders down and back against the pad.'],
  cable_fly: ['Set the pulleys at chest height and take a staggered stance with a slight forward lean.', 'With soft elbows, sweep your hands together in a hugging arc, squeeze, and return slowly.', 'The elbow bend stays the same the whole time. This is not a press.'],
  pushups: ['Hands just wider than your shoulders, body in one line from head to heels.', 'Lower until your chest nearly touches the floor with elbows about 45 degrees, then push the floor away.', 'The weight field is extra load only (plate or backpack). Your bodyweight is counted for you.'],
  dips: ['Support yourself on parallel bars or sturdy chairs with straight arms.', 'Lean slightly forward, lower until your shoulders are just below your elbows, then press back up.', 'If your shoulders pinch at the bottom, shorten the range.'],
  ohp: ['Bar at collarbone height, grip just outside shoulders, glutes and abs tight.', 'Press the bar straight up, moving your head back then through once the bar passes your forehead.', 'Do not lean back. Keep your ribs down.'],
  db_shoulder_press: ['Sit with back support and the dumbbells at shoulder height, palms forward.', 'Press up until your arms are nearly straight, then lower to about ear height.', 'The app logs both dumbbells combined.'],
  db_lat_raise: ['Stand tall with a dumbbell in each hand and a slight bend in your elbows.', 'Raise your arms out to the sides to shoulder height, leading with the elbows, then lower slowly.', 'Go lighter than you think and do not swing. The app logs both dumbbells combined.'],
  cable_lat_raise: ['Stand side-on to a low pulley with the handle in the far hand.', 'Raise your arm out to the side to shoulder height with a slight elbow bend, then lower slowly.', 'The cable keeps tension at the bottom, so do not rest there.'],
  landmine_press: ['Wedge the end of the barbell in a corner and hold the free end at your shoulder.', 'Press up and forward along the arc until your arm is straight.', 'Keep your ribs stacked over your hips and do not lean back.'],
  face_pull: ['Set a rope at upper-chest to eye height and step back until the cable is tight.', 'Pull the rope toward your face, spreading the ends apart and rotating your hands up.', 'Light weight and slow reps. Think back of the shoulders, not biceps.'],
  rear_delt_fly: ['Hinge forward with a flat back and the dumbbells hanging under your chest.', 'Raise your arms out wide with soft elbows until level with your torso, then lower slowly.', 'Keep it light. The app logs both dumbbells combined.'],
  bb_row: ['Hinge to about 45 degrees with a flat back, bar hanging below your shoulders.', 'Pull the bar to your lower ribs, squeeze your shoulder blades, then lower with control.', 'Do not jerk upright to move the weight.'],
  pendlay_row: ['Set the bar on the floor with your torso parallel to the ground and a flat back.', 'Pull the bar quickly to your lower chest and return it to the floor each rep.', 'Reset your back position on every rep.'],
  pullups: ['Hang from the bar with hands just outside shoulder width.', 'Pull your chest toward the bar by driving your elbows down, then lower to a full hang.', 'The weight field is added load only (belt or dumbbell). Bodyweight is counted for you.'],
  db_row: ['Brace one hand and one knee on a bench with a dumbbell in the other hand.', 'Pull the dumbbell toward your hip, keep your torso still, and lower until your arm is straight.', 'The app counts both sides together (one dumbbell × 2).'],
  lat_pulldown: ['Adjust the thigh pad, take a grip slightly wider than shoulders and lean back a touch.', 'Pull the bar to your upper chest by driving your elbows down and back, then let it rise slowly.', 'Do not swing your torso to move the weight.'],
  seated_cable_row: ['Sit tall with feet braced and knees slightly bent, handle in both hands.', 'Row to your navel, squeeze your shoulder blades together, then extend your arms slowly.', 'Your torso barely moves. Keep your chest tall.'],
  deadlift: ['Bar over mid-foot, hands just outside your legs, hips back, chest up, back flat.', 'Brace hard and push the floor away, keeping the bar against your legs until you stand tall.', 'Lower by pushing your hips back first. Never round your lower back.'],
  superman: ['Lie face down with your arms extended in front of you.', 'Lift your arms, chest and legs a few inches, pause one second, then lower.', 'Move slowly and keep your neck neutral.'],
  bb_squat: ['Bar on your upper back, feet shoulder width, toes slightly out, abs braced.', 'Sit down and back until your thighs are at least parallel, then drive up through your whole foot.', 'Knees track over toes. Do not let them cave in.'],
  front_squat: ['Bar across the front of your shoulders with elbows high, feet shoulder width.', 'Sit straight down keeping your chest up and elbows high, then stand.', 'If the bar rolls forward, your elbows dropped.'],
  bulgarian_split: ['Put your back foot on a bench, front foot about two feet ahead, dumbbells at your sides.', 'Lower straight down until the front thigh is parallel, then drive up through the front heel.', 'The app logs both dumbbells combined.'],
  goblet_squat: ['Hold one dumbbell vertically against your chest.', 'Squat down between your hips with elbows inside your knees, then stand.', 'A great warm-up and form drill for any squat.'],
  leg_press: ['Sit with your feet mid-platform, shoulder width apart.', 'Lower until your knees are around 90 degrees without your hips curling off the pad, then press.', 'Never lock your knees hard at the top.'],
  leg_extension: ['Set the pad just above your ankles and the back so your knees line up with the pivot.', 'Extend your legs until almost straight, squeeze, then lower slowly.', 'Do not swing the weight up.'],
  walking_lunge: ['Stand tall with dumbbells at your sides.', 'Step forward into a long stride, lower the back knee close to the floor, then step through.', 'The app logs both dumbbells combined.'],
  bw_squat: ['Stand with feet shoulder width apart, arms in front for balance.', 'Sit between your hips until your thighs are parallel, then stand tall.', 'Keep your heels on the floor.'],
  rdl: ['Stand with the bar at your hips, feet hip width, soft knees.', 'Push your hips back, sliding the bar down your thighs until you feel a hamstring stretch, then stand tall.', 'Your spine stays flat and the bar never leaves your legs.'],
  db_rdl: ['Stand with a dumbbell in each hand in front of your thighs, soft knees.', 'Push your hips back, lower the dumbbells along your legs to a hamstring stretch, then stand tall.', 'The app logs both dumbbells combined.'],
  leg_curl: ['Adjust the pad just above your heels and pin your hips down.', 'Curl your heels toward your glutes, squeeze, and lower slowly.', 'Do not let your hips lift off the pad.'],
  bb_hip_thrust: ['Sit with your upper back against a bench and the bar over your hips (use a pad).', 'Drive through your heels until your hips are fully extended, squeeze, then lower.', 'Tuck your chin and keep your ribs down so the work stays in your glutes.'],
  glute_bridge: ['Lie on your back with knees bent and feet flat.', 'Drive through your heels and lift your hips until your body forms a straight line, squeeze, then lower.', 'Tilt your pelvis back at the top to avoid arching your lower back.'],
  standing_calf_raise: ['Place the balls of your feet on the platform with your heels hanging off.', 'Lower your heels for a full stretch, then rise as high as you can and pause at the top.', 'Slow reps with a pause beat bouncing.'],
  db_calf_raise: ['Stand on a step with the balls of your feet on the edge, dumbbells at your sides.', 'Lower your heels for a stretch, then rise as high as you can and hold the top.', 'The app logs both dumbbells combined.'],
  bw_calf_raise: ['Stand on one foot on a step with your heel hanging off, hand on a wall for balance.', 'Lower for a full stretch, then rise as high as you can.', 'Switch legs after each set.'],
  bb_curl: ['Stand tall with an underhand grip, elbows pinned at your sides.', 'Curl the bar up to shoulder height, squeeze, and lower slowly.', 'No swinging. If you need momentum, the weight is too heavy.'],
  incline_curl: ['Lie back on a 45-degree bench with your arms hanging straight down.', 'Curl both dumbbells up without moving your upper arms, then lower to a deep stretch.', 'The app logs both dumbbells combined.'],
  hammer_curl: ['Stand with dumbbells at your sides, palms facing in.', 'Curl up keeping your palms facing in and your elbows still, then lower slowly.', 'The app logs both dumbbells combined.'],
  cable_curl: ['Stand facing a low pulley with a straight or EZ bar.', 'Curl up with your elbows pinned, squeeze, and lower under control.', 'The cable keeps tension at the bottom.'],
  cgbp: ['Lie on a bench and grip the bar about shoulder width.', 'Lower to your lower chest with elbows tucked, then press up.', 'Gripping too narrow stresses your wrists, so stay near shoulder width.'],
  skullcrusher: ['Lie on a bench holding the bar over your chest with straight arms.', 'Bend only at the elbows to lower the bar toward your forehead, then extend.', 'Keep your upper arms still and pointed at the ceiling.'],
  tri_pushdown: ['Stand at a high pulley with elbows pinned to your sides.', 'Push down until your arms are fully straight, squeeze, and return slowly.', 'Do not lean over the bar to cheat the weight.'],
  oh_tri_ext: ['Hold one dumbbell overhead with both hands and elbows pointing forward.', 'Lower the dumbbell behind your head, then extend your arms back up.', 'Keep your elbows from flaring out.'],
  ab_rollout: ['Kneel with the barbell in front of you, hands shoulder width, pelvis tucked.', 'Roll forward as far as you can while keeping your pelvis tucked, then pull back with your abs.', 'Stop before your lower back sags.'],
  hanging_leg_raise: ['Hang from a bar with a firm grip and shoulders engaged.', 'Curl your pelvis up as you raise your legs, then lower slowly.', 'Do not swing. Control the descent.'],
  cable_crunch: ['Kneel under a high pulley holding the rope beside your head.', 'Round your spine and bring your elbows toward your knees, then return slowly.', 'The movement is spinal flexion, not hip hinging.'],
  crunch: ['Lie on your back with knees bent and hands beside your head.', 'Curl your ribs toward your hips, pause, and lower slowly.', 'Do not pull on your neck.'],
  decline_bb_bench: ["Set a decline bench (about 15 to 30 degrees), hook your legs under the pads and pinch your shoulder blades together before unracking.", "Lower the bar to your lower chest, then press it back up over your shoulders.", "Use a spotter or safety arms. Getting stuck on a decline is harder to escape."],
  decline_db_press: ["Lie on a decline bench with your feet locked in and the dumbbells at your lower chest. Have them handed to you if they are heavy.", "Press up and slightly in until your arms are straight, then lower slowly to a stretch.", "The app logs both dumbbells combined."],
  db_chest_fly: ["Lie on a flat bench with a dumbbell in each hand over your chest, palms facing each other and a slight bend in your elbows.", "Open your arms in a wide arc until you feel a deep chest stretch, then bring the dumbbells back together.", "Keep the elbow bend the same the whole way and go lighter than a press. The app logs both dumbbells combined."],
  low_high_cable_fly: ["Set both pulleys low and stand in the middle with a staggered stance and a slight forward lean.", "Sweep your hands up and together to about chin height, squeeze your upper chest, then lower slowly.", "Keep a soft elbow bend and do not shrug. This is not a front raise."],
  high_low_cable_fly: ["Set both pulleys high and stand in the middle with a staggered stance, leaning slightly forward.", "Sweep your hands down and together toward your hips, squeezing your lower chest, then return slowly.", "Keep your elbows softly bent and your ribs down."],
  floor_press: ["Lie on the floor with your knees bent. Set the bar on low rack pins or lift it into position, with your upper arms ready to rest on the floor.", "Lower until your triceps touch the floor, pause for a second, then press up.", "The floor limits your range, which is easy on the shoulders. Do not bounce off the floor."],
  landmine_chest_press: ["Wedge one end of the barbell in a corner or landmine base and hold the other end at your chest with both hands.", "Press up and forward until your arms are straight, then lower with control.", "Keep your feet planted and your ribs down. Log the weight you load on the bar."],
  tbar_row: ["Wedge one end of the barbell in a corner or landmine base, straddle it and take hold of the bar or a close-grip handle. Hinge to about 45 degrees with a flat back.", "Row the bar toward your lower chest, squeeze your shoulder blades, then lower with control.", "Do not jerk with your hips. Keep your spine flat and log the weight you load on the bar."],
  cs_db_row: ["Lie face down on a bench set to about 30 degrees with a dumbbell in each hand hanging below you.", "Row both dumbbells toward your hips, squeeze your shoulder blades, then lower to a full stretch.", "The bench removes momentum, so it is a strict back builder. The app logs both dumbbells combined."],
  straight_arm_pulldown: ["Stand facing a high pulley with a bar or rope in your hands and your arms straight, hinged slightly at the hips.", "Keeping your arms straight, sweep the handle down to your thighs by squeezing your lats, then let it rise slowly.", "The movement comes from your shoulders, not your elbows. Do not bend your arms."],
  meadows_row: ["Wedge one end of a barbell in a corner or landmine base and stand side-on to it, holding the thick end near the plates with one hand.", "Hinge forward, row the bar toward your hip and squeeze your upper back, then lower to a stretch.", "Log the weight loaded on the bar. Do the same reps on each side."],
  rack_pull: ["Set the bar on pins at about knee height. Stand close with a hip-width stance, grip just outside your legs, chest up and back flat.", "Brace and stand up, driving your hips forward until you are fully upright, then lower under control.", "You can lift more than from the floor, so keep your back flat and use straps if your grip fails first."],
  inverted_row: ["Set a bar at about waist height in a rack (or lie under a sturdy table) and hang below it with your body in a straight line and your heels on the floor.", "Pull your chest to the bar by squeezing your shoulder blades together, then lower to straight arms.", "Walk your feet forward to make it harder. The weight field is extra load only (vest or plate)."],
  bb_shrug: ["Stand holding a barbell in front of your thighs with your hands just outside your hips.", "Lift your shoulders straight up toward your ears, pause at the top, then lower slowly.", "Do not roll your shoulders. Straps help if your grip gives out before your traps do."],
  db_shrug: ["Stand holding a dumbbell in each hand at your sides.", "Lift your shoulders straight up, pause for a second at the top, and lower slowly.", "Keep your arms straight and your head neutral. The app logs both dumbbells combined."],
  cable_upright_row: ["Stand facing a low pulley with a bar or rope held at your thighs, hands about shoulder width apart.", "Pull the handle up the front of your body to chest height, leading with your elbows, then lower under control.", "Stop at chest height. If your shoulders pinch, use a wider grip or a shorter range."],
  db_front_raise: ["Stand tall with a dumbbell in each hand in front of your thighs.", "Raise your arms straight in front of you to shoulder height, then lower slowly.", "No swinging or leaning back. The app logs both dumbbells combined."],
  arnold_press: ["Sit with back support and hold the dumbbells at chest height with your palms facing you.", "Press up while rotating your palms to face forward, finish with your arms nearly straight, then reverse the motion on the way down.", "Use a lighter weight than a regular press. The app logs both dumbbells combined."],
  cable_y_raise: ["Set the pulleys low and stand with a handle in each hand, arms crossed in front of your thighs.", "Raise your arms up and out into a Y shape to about ear height with your thumbs up, then lower slowly.", "Go light and keep your ribs down. Think rear and side shoulders, not upper traps."],
  cable_egyptian_raise: ["Stand beside a low pulley with the cable running behind your back. Take the handle with your far hand and hold a post with the other to lean slightly away.", "Raise your arm out to the side to just above shoulder height, then lower slowly.", "Leaning away keeps tension on the side delt at the bottom. Log the weight of one side."],
  bb_upright_row: ["Stand holding a barbell in front of your thighs with a grip about shoulder width.", "Pull the bar up to chest height, leading with your elbows, then lower under control.", "Keep the bar close and stop at chest height. A wider grip is easier on the shoulders."],
  face_pull_press: ["Set a rope at upper-chest height and step back until the cable is tight.", "Pull the rope toward your face with the ends apart, rotate your hands up, then press overhead. Reverse the motion back to the start.", "Use light weight and slow reps. Keep your ribs down as you press."],
  bench_dips: ["Sit on the edge of a bench with your hands beside your hips, then slide forward with your legs out in front.", "Lower until your elbows are about 90 degrees, then press back up.", "If your shoulders feel pinched, bend your knees or shorten the range. The weight field is extra load only."],
  db_skullcrusher: ["Lie on a bench with a dumbbell in each hand, arms straight over your chest and palms facing each other.", "Bend only at the elbows to lower the dumbbells beside your head, then extend again.", "Keep your upper arms still. The app logs both dumbbells combined."],
  oh_cable_tri_ext: ["Set a rope on a low or mid pulley, face away from the stack and hold the rope behind your head with your elbows pointing forward.", "Extend your arms overhead until they are straight, then lower slowly to a stretch.", "Keep your elbows from flaring out and your ribs down."],
  jm_press: ["Lie on a bench and grip the bar just inside shoulder width, with the bar over your upper chest.", "Lower the bar toward your upper chest and chin by letting your elbows travel forward, halfway between a skullcrusher and a close-grip bench, then press up.", "It is a technical lift. Start light and use a spotter or safety arms."],
  tate_press: ["Lie on a bench with the dumbbells held over your chest, elbows flared out to the sides.", "Bend at the elbows to lower the dumbbells toward your chest, then extend them back up.", "Keep the weight light and your upper arms steady. The app logs both dumbbells combined."],
  single_arm_cable_curl: ["Stand facing a low pulley with a single handle in one hand.", "Curl up with your elbow pinned to your side, squeeze at the top, then lower slowly.", "Do the same reps on each arm. Log the weight of one side."],
  reverse_bb_curl: ["Stand holding a barbell with an overhand grip, hands shoulder width apart.", "Curl the bar up with your elbows pinned to your sides, then lower slowly.", "This works your forearms and the brachialis. Go lighter than a regular curl and keep your wrists straight."],
  preacher_curl: ["Set up on a preacher bench so your upper arms rest flat on the pad, and hold the bar with an underhand grip. No preacher pad? Rest your upper arm on the top of an incline bench and curl one arm at a time.", "Curl up, squeeze, then lower to nearly straight arms.", "Do not drop at the bottom, which stresses the elbow. Stop just short of locking out."],
  incline_hammer_curl: ["Lie back on a bench set to about 45 to 60 degrees with the dumbbells hanging at your sides, palms facing in.", "Curl up keeping your palms facing in and your upper arms still, then lower to a full stretch.", "Works the biceps and brachialis (forearm). The app logs both dumbbells combined."],
  bayesian_curl: ["Set a low pulley and face away from it, holding a single handle behind you with your arm extended back.", "Curl the handle forward, keeping your upper arm behind your torso, squeeze at the top, then lower slowly.", "The stretch is the point, so keep your arm behind you. Log the weight of one side."],
  spider_curl: ["Lie chest-down on a bench set to about 45 degrees with the dumbbells hanging straight down, palms forward.", "Curl up, squeeze, and lower to a full stretch without swinging.", "Your chest stays on the pad. The app logs both dumbbells combined."],
  farmers_walk: ["Pick up a heavy dumbbell in each hand, stand tall with your shoulders back and your ribs down.", "Walk about 20 yards with quick, controlled steps, then turn around. Each rep in the app is one trip.", "Do not lean or let the weights swing. Log both dumbbells combined. The app does not suggest a weight for this one, so pick one you can carry with good posture."],
  box_squat: ["Set a box or bench at a height where your thighs are about parallel when seated. Bar on your upper back, feet slightly wider than shoulders.", "Sit back and down until you touch the box with control, pause briefly, then drive up.", "Do not rock or collapse onto the box. Stay braced the whole time."],
  zercher_squat: ["Hold the bar in the crooks of your elbows against your upper stomach with your arms crossed. Use a pad if it digs in.", "Sit down between your hips with your chest tall, then stand up.", "Keep your elbows pointing forward and your torso upright. Start light because the bar is uncomfortable until you are used to it."],
  hack_squat: ["Set your shoulders against the pads and your feet about shoulder width, mid-platform.", "Lower until your thighs are at least parallel, then drive up through your whole foot without locking your knees.", "Do not let your hips peel off the seat. A lower foot position hits the quads harder. A barbell hack squat (bar held behind your legs) works too, but start light."],
  heel_goblet_squat: ["Hold one dumbbell against your chest and stand with your heels on a small plate or wedge.", "Squat down between your hips keeping your chest tall and your knees forward, then stand.", "The raised heels let your knees travel forward to load the quads. Use a small, stable plate."],
  db_step_up: ["Stand facing a bench or box with a dumbbell in each hand at your sides. The box should put your thigh about parallel when your foot is on it.", "Step up with one foot, drive through that heel until you stand tall, then step down with control.", "Do all reps on one leg, then switch. Do not push off the back foot. The app logs both dumbbells combined."],
  sissy_squat: ["Stand near a wall or post for balance with your feet hip width apart.", "Rise onto your toes and lean back while bending your knees forward and lowering your hips, then come back up.", "This is a hard stretch for the knees. Go slowly, only as deep as is comfortable, and skip it if your knees hurt. Hold a plate to make it harder."],
  good_morning: ["Set the bar on your upper back as for a squat, with your feet shoulder width and your knees soft.", "Push your hips back and hinge forward until your torso is close to parallel, then drive your hips forward to stand.", "Keep your back flat and the weight light. Stop if your back starts to round."],
  seated_leg_curl: ["Adjust the pad above your heels and the seat so your knees line up with the pivot, then secure the thigh pad.", "Curl your heels down and back, squeeze, then let the weight rise slowly.", "Do not lift your hips off the seat."],
  nordic_curl: ["Kneel on a pad with your ankles secured under a bar, a heavy object, or a partner, and your body straight from knees to head.", "Lower yourself forward as slowly as you can with your hips extended, catch yourself with your hands, then push back up.", "Use a band for help at first and go slowly. It is very hard on the hamstrings, so build up the reps gradually."],
  sl_db_rdl: ["Stand on one leg holding dumbbells in front of you with a slight bend in the standing knee.", "Hinge at the hip, lowering the dumbbells while your free leg extends behind you, until you feel a hamstring stretch, then stand.", "Keep your hips square to the floor. Do the same reps on each side and log the total weight you hold."],
  ghr: ["Set up on the glute-ham raise station with your ankles secured and your hips just past the pad.", "Lower your torso toward the floor under control, then curl yourself back up by squeezing your hamstrings and glutes.", "Do not hyperextend at the top. Cross your arms on your chest, or hold a plate to make it harder."],
  cable_kickback: ["Attach an ankle strap to a low pulley, face the machine and hold on for balance.", "With your knee slightly bent, kick your leg straight back, squeeze your glute at the end, then return slowly.", "Do not arch your lower back. Log the weight of one side."],
  cable_pull_through: ["Set a rope on a low pulley and stand facing away from the stack, holding the rope between your legs.", "Push your hips back to hinge, letting the rope pass between your legs, then drive your hips forward and squeeze your glutes to stand.", "It is a hip hinge, not a squat. Keep your back flat and your arms straight."],
  deficit_reverse_lunge: ["Stand on a low step or a plate with dumbbells at your sides.", "Step one foot back and down off the step, lower your back knee close to the floor, then drive through the front heel to return.", "Keep your torso slightly forward and your front knee over your toes. The app logs both dumbbells combined."],
  db_sumo_squat: ["Stand with your feet wider than shoulders and your toes turned out, holding one dumbbell hanging between your legs.", "Sit straight down with your knees tracking over your toes, then stand and squeeze your glutes.", "Keep your chest tall. The app logs the weight of the dumbbell."],
  sl_hip_thrust: ["Sit with your upper back against a bench, one foot flat on the floor and the other leg extended or held in the air.", "Drive through your heel to lift your hips until your body forms a straight line, squeeze, then lower.", "Keep your ribs down and your hips level. Hold a dumbbell on your hips to make it harder. Do both sides."],
  curtsy_lunge: ["Stand holding dumbbells at your sides.", "Step one foot back and across behind your front leg, bending both knees, then stand back up.", "Keep your front knee tracking over your toes and your chest tall. The app logs both dumbbells combined."],
  seated_calf_raise: ["Sit at the machine with the pad on your lower thighs and the balls of your feet on the platform.", "Lower your heels for a deep stretch, then rise as high as you can and pause at the top.", "Slow reps and a full stretch matter more than the weight. The bent knee works the soleus."],
  donkey_calf_raise: ["Position yourself on a donkey calf raise machine, or hinge at the hips with your hips against the pad and the balls of your feet on the edge.", "Lower your heels for a full stretch, then rise as high as possible and pause.", "Keep your knees straight and your back flat. Slow, full-range reps."],
  tib_raise: ["Stand with your back against a wall and your feet about a foot ahead of you.", "Lift your toes toward your shins as high as you can, hold for a second, then lower slowly.", "Go slowly for higher reps. This works the muscle on the front of your lower leg."],
  bicycle_crunch: ["Lie on your back with your hands beside your head and your legs raised.", "Bring one elbow toward the opposite knee while extending the other leg, then switch sides in a pedaling motion.", "Move slowly and do not pull on your neck. Count each twist as one rep."],
  plank: ["Rest on your forearms and toes with your elbows under your shoulders and your body in a straight line.", "Squeeze your glutes and abs, tuck your pelvis slightly and breathe steadily.", "The app counts this in seconds. Type the seconds you held into the Reps box, and stop when your hips sag."],
  situp: ["Lie on your back with your knees bent and your feet flat (anchor them if needed), arms crossed on your chest.", "Curl up until your chest reaches your knees, then lower slowly.", "Do not yank on your neck. Control the way down."],
  side_plank: ["Lie on your side with your elbow under your shoulder and your legs stacked.", "Lift your hips so your body forms a straight line and hold.", "Type the seconds you held into the Reps box. Do the same on both sides."],
  pallof_press: ["Set a cable at chest height and stand sideways to it, holding the handle at your chest with both hands.", "Press your hands straight out in front of you and hold for a second without letting your torso rotate, then bring them back in.", "The cable tries to rotate you and your job is to resist it. Do the same reps on both sides."],
  captains_chair_raise: ["Rest your forearms on the pads with your back against the backrest and your legs hanging.", "Raise your knees (or straight legs for more challenge) to hip height while curling your pelvis up, then lower slowly.", "Do not swing. Curl your pelvis rather than only lifting your legs."],
  cable_woodchop: ["Set a pulley high (or low) and stand sideways to it, holding the handle with both hands.", "Rotate your torso and pull the handle diagonally across your body to the opposite hip (or shoulder), pivoting your back foot, then return under control.", "The power comes from your torso and hips, not your arms. Do the same reps on both sides."],
  russian_twist: ["Sit with your knees bent and your torso leaned back about 45 degrees, holding a dumbbell with both hands at your chest.", "Rotate your torso to tap the weight beside one hip, then to the other side.", "Keep your chest up and your back from rounding. Lift your feet for more challenge. Count each side as one rep."],
  dragon_flag: ["Lie on a bench and grip it behind your head. Lift your hips and legs until you are balanced on your upper back.", "Keeping your body straight, lower slowly until your legs are just above the bench, then bring them back up (or do the lowering part only).", "This is very hard. Bend your knees to make it easier, and stop if you feel it in your neck or lower back."],
  decline_situp: ["Hook your feet under the pads of a decline bench and hold a plate or dumbbell against your chest.", "Curl up until your chest reaches your knees, then lower slowly.", "Do not pull on your neck. Start with no weight if the decline is new to you."],
  cardio_run: ['Start with a few minutes of easy jogging or walking.', 'Hold a conversational pace, or alternate hard and easy efforts for intervals.', 'Build distance gradually to protect your joints.'],
  cardio_walk: ['Walk at a brisk pace and swing your arms.', 'Add incline on a treadmill to raise the effort.', 'Easy to do on rest days.'],
  cardio_bike: ['Adjust the seat so your knee has a slight bend at the bottom of the pedal stroke.', 'Hold a smooth cadence around 80 to 100 rpm.', 'Raise resistance for harder efforts.'],
  cardio_row: ['Sit with your feet strapped in, shins vertical, arms straight.', 'Drive with your legs first, then lean back and pull the handle to your ribs. Reverse on the way back.', 'Legs, hips, arms on the way out. Arms, hips, legs on the way back.'],
  cardio_rope: ['Hold the handles at hip height with elbows close to your sides.', 'Turn the rope with your wrists and make small, light hops.', 'Land softly on the balls of your feet.'],

/* ---------- bodyweight vs strength chart ---------- */
function multiChart(series) {
  const all = series.flatMap(s => s.pts); if (all.length < 2) return '';
  const w = 340, h = 190, pl = 40, pr = 12, pt = 12, pb = 22;
  let x0 = Math.min(...all.map(p => p.t)), x1 = Math.max(...all.map(p => p.t)); if (x0 === x1) { x0 -= DAY; x1 += DAY; }
  let y0 = Math.min(0, ...all.map(p => p.v)), y1 = Math.max(0, ...all.map(p => p.v)); const py = (y1 - y0) * .15 || 1; y0 -= py; y1 += py;
  const X = t => pl + (t - x0) / (x1 - x0) * (w - pl - pr), Y = v => pt + (1 - (v - y0) / (y1 - y0)) * (h - pt - pb);
  const fmt = v => (v > 0 ? '+' : '') + Math.round(v) + '%';
  const ticks = [y0 + py, 0, y1 - py].map(v => `<text x="${pl - 6}" y="${Y(v) + 3}" text-anchor="end">${fmt(v)}</text><line x1="${pl}" x2="${w - pr}" y1="${Y(v)}" y2="${Y(v)}" ${v === 0 ? 'class="zero"' : ''}/>`).join('');
  const lines = series.map(s => s.pts.length ? `<path d="${s.pts.map((p, i) => (i ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ')}" class="ln ${s.cls}"/>${s.pts.map(p => `<circle class="${s.cls}" cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.6"/>`).join('')}` : '').join('');
  return `<svg viewBox="0 0 ${w} ${h}" class="chart" role="img" aria-label="Bodyweight and strength change over time"><g class="grid">${ticks}</g>${lines}
    <text class="xl" x="${pl}" y="${h - 5}">${fmtDate(x0)}</text><text class="xl" x="${w - pr}" y="${h - 5}" text-anchor="end">${fmtDate(x1)}</text></svg>
    <div class="legend">${series.map(s => `<span><i class="${s.cls}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}
function bodyVsStrength() {
  const now = Date.now(), from = prog.range ? now - prog.range * DAY : 0, cvt = (v, u) => !u || u === unit() ? v : v * (unit() === 'kg' ? KG : 1 / KG);
  const bwp = state.measures.filter(m => +m.weight > 0 && m.t >= from).sort((a, b) => a.t - b.t).map(m => ({ t: m.t, v: cvt(+m.weight, m.unit) }));
  const lifts = Object.keys(state.e1rmHist).map(id => ({ id, ex: exById(id), pts: state.e1rmHist[id].filter(p => p.t >= from).sort((a, b) => a.t - b.t) })).filter(l => l.ex && !l.ex.bw && !l.ex.noE1 && l.pts.length >= 2);
  const head = '<div class="row sp"><h2 class="h2">Bodyweight vs strength</h2></div>';
  if (bwp.length < 2 || !lifts.length) return `<div class="card">${head}<div class="empty">${!lifts.length ? 'Log a few sessions with the same lifts to see your strength trend.' : 'Log your weight on at least two days in the Body tab to compare it with your strength.'}</div></div>`;
  const times = [...new Set(lifts.flatMap(l => l.pts.map(p => p.t)))].sort((a, b) => a - b), step = Math.max(1, Math.ceil(times.length / 60)), sample = times.filter((_, i) => i % step === 0 || i === times.length - 1);
  const idx = sample.map(t => {
    let sum = 0, n = 0; lifts.forEach(l => { let v = null; for (const p of l.pts) { if (p.t <= t) v = p.v; else break; } if (v != null) { sum += v / l.pts[0].v; n++; } });
    return n ? { t, v: (sum / n - 1) * 100 } : null;

  const b0 = bwp[0].v, bwLine = bwp.map(p => ({ t: p.t, v: (p.v / b0 - 1) * 100 }));
  const lastBw = bwp[bwp.length - 1].v, dBw = lastBw - b0, sGain = idx.length ? idx[idx.length - 1].v : 0;
  const sel = prog.ex && exById(prog.ex) && !exById(prog.ex).bw && state.e1rm[prog.ex] ? exById(prog.ex) : null, rel = sel ? (state.e1rm[sel.id] / lastBw).toFixed(2) : null;

    ${multiChart([{ name: 'Strength', cls: 'a', pts: idx }, { name: 'Bodyweight', cls: 'b', pts: bwLine }])}
    <div class="tiles pt8">${tile((dBw > 0 ? '+' : '') + (Math.round(dBw * 10) / 10) + ' ' + unit(), 'Bodyweight')}${tile((sGain > 0 ? '+' : '') + Math.round(sGain) + '%', 'Strength')}${rel ? tile(rel + '×', esc(sel.name.split(' ').slice(0, 2).join(' ')) + ' ÷ BW') : ''}</div></div>`;

  const f = u => (!u || u === unit()) ? 1 : (unit() === 'kg' ? KG : 1 / KG);

/* ----- calories (a rough estimate: MET × body weight × time) ----- */
const CARDIO_MET = { cardio_run: 8.5, cardio_walk: 3.8, cardio_bike: 6.8, cardio_row: 7, cardio_rope: 10, cardio_stairs: 8.5, cardio_elliptical: 5, cardio_swim: 7, cardio_hiit: 8 };
function estKcal({ min, workSets, cardio }) {
  const kg = unit() === 'kg' ? bw() : bw() * KG;
  const cm = cardio.reduce((a, c) => a + (+c.min || 0), 0);
  let sm = Math.max(0, (min || 0) - cm);
  if (sm < workSets * 1.2) sm = workSets * 2.5;                 // sets were tapped in quickly or logged after the fact
  const pace = sm > 0 ? workSets / (sm / 10) : 0;                // working sets per 10 minutes
  const met = clamp(2.8 + pace * 0.9, 3, 6);
  let k = met * kg * (sm / 60);
  cardio.forEach(c => { k += (CARDIO_MET[c.exId] || 6) * kg * ((+c.min || 0) / 60); });
  return clamp(Math.round(k / 5) * 5, 0, 2500);
}

/* ----- achievements ----- */
function sessAchievements(rec, prior, prs, stBefore) {
  const out = [], u = rec.unit, n = prior.length + 1;
  prs.filter(p => p.prev).forEach(p => out.push({ ic: '🏆', t: `New PR: ${p.name}`, d: `${p.w} ${u} × ${p.r} · est. 1RM ${p.prev} → ${p.now} ${u}` }));
  prs.filter(p => !p.prev).slice(0, 3).forEach(p => out.push({ ic: '🆕', t: `First record: ${p.name}`, d: `${p.w ? p.w + ' ' + u + ' × ' : ''}${p.r} is your starting mark. Beat it next time.` }));
  const same = prior.filter(h => h.unit === u && h.vol > 0 && !h.deload);
  if (same.length >= 3 && rec.vol > 0 && !rec.deload) {
    const best = Math.max(...same.map(h => h.vol));
    if (rec.vol > best) out.push({ ic: '📈', t: 'Biggest session ever by volume', d: `${rec.vol.toLocaleString()} ${u} vs your previous best of ${best.toLocaleString()}` });
  }
  const before = same.reduce((a, h) => a + h.vol, 0), after = before + rec.vol;
  const crossed = [1e4, 2.5e4, 5e4, 1e5, 2.5e5, 5e5, 1e6, 2.5e6, 5e6, 1e7].filter(x => before < x && after >= x).pop();
  if (crossed) out.push({ ic: '🏋️', t: `${crossed.toLocaleString()} ${u} lifted all-time`, d: `Lifetime total is now ${after.toLocaleString()} ${u}` });
  if (n === 1) out.push({ ic: '🎉', t: 'Your first workout is in the books', d: 'Every streak starts with one.' });
  else if ([5, 10, 25, 50, 75, 100, 150, 200, 250, 300, 350].includes(n) && prior.length < 400) out.push({ ic: '🎯', t: `Workout #${n}`, d: 'Consistency is the whole game.' });
  const st = streakInfo();
  if (stBefore.curN < st.goal && st.curN >= st.goal) out.push({ ic: '✅', t: 'Weekly goal hit', d: `${st.curN} of ${st.goal} sessions this week${st.streak >= 2 ? ` · ${st.streak}-week streak 🔥` : ''}` });
  (rec.cardio || []).forEach(c => {
    const prev = Math.max(0, ...prior.flatMap(h => (h.cardio || []).filter(x => x.exId === c.exId).map(x => +x.min || 0)));
    if (prev > 0 && c.min > prev) out.push({ ic: '🏃', t: `Longest ${c.name.split(' (')[0]} yet`, d: `${c.min} min vs your previous best of ${prev} min` });
  });
  return out.slice(0, 8);
}

function logQLToday(list) {
  const prs = [];

    const ex = r.ex;

      let it = wk().items.find(x => x.cardio && x.exId === ex.id && !x.done);
      if (!it) { it = buildItem(ex, {}); wk().items.push(it); }
      it.min = r.min || it.min; it.dist = r.dist || 0; it.done = true; return;
    }
    let it = wk().items.find(x => !x.cardio && x.exId === ex.id);
    if (!it) { it = { id: uid(), exId: ex.id, superset: null, tempo: ex.tempo, sets: [] }; wk().items.push(it); }
    for (let k = 0; k < r.sets; k++) {
      let s = it.sets.find(x => !x.done && x.type === 'work');
      if (!s) { s = { type: 'work', fail: false, done: false }; it.sets.push(s); }
      Object.assign(s, { weight: r.w, reps: r.r, rir: r.rir ?? 2, fail: !!r.fail });

function logQLPast(list, t) {      // saved straight to history on the chosen day
