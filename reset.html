<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ForgeFit refresh</title><meta name="robots" content="noindex">
<style>
html{background:#0b0f19;color:#e8ecf4;font:17px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{max-width:460px;margin:0 auto;padding:48px 22px}
h1{font-size:26px;margin:0 0 6px}p{color:#a9b3c7;margin:10px 0}
.card{background:#141a29;border:1px solid #232b40;border-radius:16px;padding:18px;margin:22px 0}
b{color:#e8ecf4}
a.btn{display:block;text-align:center;background:#f97316;color:#1a0f05;font-weight:700;text-decoration:none;padding:15px;border-radius:14px;margin-top:18px}
</style></head><body>
<h1>Refreshing ForgeFit…</h1>
<p>This clears the app's saved <b>program files</b> so the newest version can load. Your workouts, history, photos and settings are <b>not touched</b>.</p>
<div class="card" id="out">Working…</div>
<a class="btn" id="go" href="./" style="display:none">Open ForgeFit</a>
<script>
(async () => {
  const out = document.getElementById('out'), lines = [];
  let regs = 0, caches_ = 0;
  try { if (navigator.serviceWorker) { for (const r of await navigator.serviceWorker.getRegistrations()) { await r.unregister(); regs++; } } } catch (e) { lines.push('Could not remove the old helper: ' + e.message); }
  try { if (window.caches) { for (const k of await caches.keys()) { await caches.delete(k); caches_++; } } } catch (e) { lines.push('Could not clear saved files: ' + e.message); }
  lines.unshift('Removed ' + regs + ' old helper(s) and ' + caches_ + ' saved file set(s).', 'Opening the newest version…');
  out.innerHTML = lines.map(l => '<div>' + l.replace(/</g, '&lt;') + '</div>').join('');
  const go = document.getElementById('go'); go.href = './?fresh=' + Date.now(); go.style.display = 'block';
  setTimeout(() => location.replace(go.href), 1800);
})();
</script></body></html>
