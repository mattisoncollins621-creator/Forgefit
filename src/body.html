<div id="boot">Loading ForgeFit…</div>

<div id="hdr">
  <div class="hbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><g transform="rotate(45 12 12)"><rect x="6" y="2.5" width="12" height="6.5" rx="1.6"/><rect x="10.5" y="9" width="3" height="12.5" rx="1.3"/></g></svg>
      </div>
      <div><h1>FORGE<span>FIT</span></h1><p>Smart training &amp; recovery</p></div>
    </div>
    <div class="row gap6"><span id="clock" hidden></span><button class="pill" id="pname" data-a="profMenu" aria-label="Switch person" hidden></button><button class="pill" data-a="plateTop" aria-label="Plate calculator">⚖ Plates</button></div>
  </div>
  <div id="tbar" hidden>
    <div id="tfill"></div>
    <div class="tin"><div><small id="tlabel">Rest</small><div id="tdisp">00:00</div></div>
      <div class="row gap6"><button data-a="tadj" data-n="-15">−15s</button><button data-a="tadj" data-n="15">+15s</button><button class="skip" data-a="tskip">Skip</button></div></div>
  </div>
</div>

<main>
  <section id="tab-workout" class="tab"></section>
  <section id="tab-recovery" class="tab" hidden></section>
  <section id="tab-progress" class="tab" hidden></section>
  <section id="tab-body" class="tab" hidden></section>
  <section id="tab-more" class="tab" hidden></section>
</main>

<nav id="nav" aria-label="Main"><div>
  <button id="nav-workout" class="on" data-a="go" data-t="workout"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Workout</button>
  <button id="nav-recovery" data-a="go" data-t="recovery"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="17" height="10" rx="2.5"/><path d="M22 10.5v3M11.5 9.5l-2.2 2.9h3.4l-2.2 2.9"/></svg>Recovery</button>
  <button id="nav-progress" data-a="go" data-t="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Progress</button>
  <button id="nav-body" data-a="go" data-t="body"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2.3"/><path d="M12 8v6M6.5 10.5h11M12 14l-3 6.5M12 14l3 6.5"/></svg>Body</button>
  <button id="nav-more" data-a="go" data-t="more"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>More</button>
</div></nav>

<div id="sheet" hidden>
  <div class="scrim" data-a="closeSheet"></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-t">
    <div class="grab"></div>
    <div class="sheet-h"><h3 id="sheet-t"></h3><button class="ib" data-a="closeSheet" aria-label="Close">✕</button></div>
    <div id="sheet-b"></div>
  </div>
</div>

<div id="pr" hidden><div id="confetti"></div><div id="pr-body"></div></div>
<div id="onboard" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="photo-in" accept="image/*" hidden>
<input type="file" id="import-in" accept="application/json,.json" hidden>
